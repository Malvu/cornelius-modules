<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="titre desc">
  <title id="titre">Cornelius · modules</title>
  <desc id="desc">L’orbe de Cornelius, reliée à des modules qui s’y branchent, sur un miroir noir.</desc>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1312" />
      <stop offset="1" stop-color="#030605" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38b4a0" stop-opacity="0.5" />
      <stop offset="0.55" stop-color="#38b4a0" stop-opacity="0.1" />
      <stop offset="1" stop-color="#38b4a0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbe" cx="0.42" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#e4fbf5" />
      <stop offset="0.28" stop-color="#9fe6d8" />
      <stop offset="0.62" stop-color="#3fb7a3" />
      <stop offset="1" stop-color="#0f4f45" />
    </radialGradient>
    <linearGradient id="irise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff" />
      <stop offset="0.35" stop-color="#b39dff" />
      <stop offset="0.65" stop-color="#ff8f7a" />
      <stop offset="1" stop-color="#9fe0c0" />
    </linearGradient>
    <linearGradient id="carte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#fond)" />
  <rect x="14" y="14" width="1252" height="392" rx="20" fill="none" stroke="#dbe9c9" stroke-opacity="0.08" />

  <!-- Poussière lumineuse -->
  <g fill="#c6f2e7">
    <circle cx="96" cy="64" r="1.4" opacity="0.5" />
    <circle cx="240" cy="372" r="1.1" opacity="0.4" />
    <circle cx="610" cy="54" r="1.2" opacity="0.35" />
    <circle cx="1190" cy="80" r="1.5" opacity="0.45" />
    <circle cx="1110" cy="372" r="1.1" opacity="0.4" />
    <circle cx="780" cy="386" r="1.3" opacity="0.3" />
  </g>

  <!-- Liaisons entre l'orbe et les modules -->
  <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 7">
    <path d="M300 210 Q360 120 448 104" stroke="#7cc4ff" stroke-opacity="0.55" />
    <path d="M300 210 Q380 210 460 210" stroke="#b39dff" stroke-opacity="0.55" />
    <path d="M300 210 Q360 300 448 316" stroke="#ffb35c" stroke-opacity="0.55" />
  </g>

  <!-- Orbe -->
  <g transform="translate(250 210)">
    <circle r="160" fill="url(#halo)" />
    <circle r="86" fill="none" stroke="url(#irise)" stroke-width="5" opacity="0.55" filter="url(#flou)" />
    <circle r="80" fill="url(#orbe)" />
    <circle r="80" fill="none" stroke="url(#irise)" stroke-width="1.4" opacity="0.7" />
    <ellipse cx="-17" cy="-40" rx="40" ry="17" fill="#ffffff" opacity="0.28" />
    <ellipse cx="28" cy="45" rx="23" ry="7" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- Modules qui se branchent -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(448 72)">
      <rect width="196" height="64" rx="14" fill="url(#carte)" stroke="#7cc4ff" stroke-opacity="0.45" />
      <rect x="18" y="20" width="24" height="24" rx="6" fill="none" stroke="#7cc4ff" stroke-width="2" />
      <path d="M18 28 H42 M25 16 V22 M35 16 V22" stroke="#7cc4ff" stroke-width="2" stroke-linecap="round" />
      <text x="54" y="28" font-size="13" fill="#9baba2">Vacances · zone C</text>
      <text x="54" y="48" font-size="18" fill="#f2efe8">dans 44 jours</text>
    </g>
    <g transform="translate(460 178)">
      <rect width="196" height="64" rx="14" fill="url(#carte)" stroke="#b39dff" stroke-opacity="0.45" />
      <circle cx="30" cy="32" r="11" fill="#b39dff" opacity="0.85" />
      <text x="54" y="28" font-size="13" fill="#9baba2">Prochain férié</text>
      <text x="54" y="48" font-size="18" fill="#f2efe8">11 novembre</text>
    </g>
    <g transform="translate(448 284)">
      <rect width="196" height="64" rx="14" fill="none" stroke="#ffb35c" stroke-opacity="0.6" stroke-dasharray="6 5" />
      <path d="M30 22 V42 M20 32 H40" stroke="#ffb35c" stroke-width="2.4" stroke-linecap="round" />
      <text x="54" y="28" font-size="13" fill="#9baba2">Votre module</text>
      <text x="54" y="48" font-size="18" fill="#f2efe8">à brancher</text>
    </g>
  </g>

  <!-- Titre -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="716" y="176" font-size="74" font-weight="600" fill="#f2efe8" letter-spacing="2">Cornelius</text>
    <text x="720" y="228" font-size="40" font-weight="300" fill="#6fd1bf" letter-spacing="1">modules</text>
    <text x="720" y="276" font-size="22" fill="#9baba2">De nouvelles informations pour le miroir,</text>
    <text x="720" y="306" font-size="22" fill="#9baba2">mises à jour sans toucher à Cornelius</text>
    <text x="720" y="350" font-size="17" fill="#6fd1bf" letter-spacing="1.5">UN DOSSIER · UN MODULE · UN GIT PULL</text>
  </g>
</svg>
